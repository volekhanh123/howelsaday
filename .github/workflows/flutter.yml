name: Flutter CI

on:
  push:
    paths:
      - '**.dart'
      - pubspec.yaml
      - .github/workflows/flutter.yml
  pull_request:
    paths:
      - '**.dart'
      - pubspec.yaml
      - .github/workflows/flutter.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
